# Отправка утреннего дайджеста в Telegram в 9:00 по Тбилиси (05:00 UTC).
# Отправляется только сегодняшний выпуск и только один раз.
# Также срабатывает сразу, когда в digests/ появляется новый выпуск.
name: Send digest

on:
  schedule:
    - cron: "0 5 * * *"
  push:
    paths:
      - "digests/*.md"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: send-digest
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Send today's digest
        shell: pwsh
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: ./scripts/send-digest.ps1 -OnlyIfNew

      - name: Remember what was sent
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "digest: mark as sent"
          git pull --rebase --quiet || true
          git push
