# Оповещения о матчах Реала и Зенита: за 15 минут (с составом), начало, итог.
# GitHub запускает проверку примерно каждые 5 минут (иногда с опозданием на несколько минут).
name: Match alerts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: match-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check matches and send alerts
        shell: pwsh
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: ./scripts/match-alerts.ps1

      - name: Remember what was sent
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "alerts: update sent state"
          git pull --rebase --quiet || true
          git push
